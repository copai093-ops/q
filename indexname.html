<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kuch Naya Dekhe</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      text-align: center;
      width: 90%;
      max-width: 450px;
    }
    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      color: #00ffea;
      text-shadow: 0 0 10px #00ffea;
    }
    p.subtitle {
      font-size: 1.3rem;
      margin-bottom: 30px;
      color: #e0e0e0;
    }
    label {
      display: block;
      text-align: left;
      margin: 15px 0 5px;
      font-size: 1.1rem;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      background: rgba(255,255,255,0.15);
      color: white;
    }
    input::placeholder {
      color: rgba(255,255,255,0.7);
    }
    button {
      width: 100%;
      padding: 14px;
      background: #00ffea;
      color: black;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover {
      background: #00d4c0;
      transform: translateY(-3px);
    }
    #videoContainer {
      display: none;
      text-align: center;
      padding: 20px;
    }
    video, iframe {
      width: 100%;
      max-width: 900px;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0,255,234,0.4);
    }
  </style>
</head>
<body>

  <div class="container" id="formContainer">
    <h1>Kuch Naya Dekhe!</h1>
    <p class="subtitle">Apna naam aur janm-tithi daalo aur duniya badal jaayegi 😄</p>
    
    <form id="myForm">
      <label for="name">Tera Naam:</label>
      <input type="text" id="name" placeholder="Yahan naam likh do..." required>
      
      <label for="dob">Janm Tithi (DOB):</label>
      <input type="date" id="dob" required>
      
      <button type="submit">Dekhna Shuru Karo →</button>
    </form>
  </div>

  <div id="videoContainer">
    <!-- Yahan apni video daalo (YouTube example diya hai, change kar sakte ho) -->
    <iframe 
      width="100%" height="515" 
      src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=0" 
      title="Surprise Video" 
      frameborder="0" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen>
    </iframe>

    <!-- Agar local video use karna hai to uncomment karo aur src change karo -->
    <!-- <video controls autoplay>
      <source src="your-video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video> -->
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbzrNqpsqTPudA9b3zgtfyi6yF18lpxxyPVoi2I9pAQFAX4v1dtRexPJtARFudrHFLwC/exec";

    document.getElementById("myForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const dob = document.getElementById("dob").value;

      if (!name || !dob) {
        alert("Naam aur DOB dono daal do bhai!");
        return;
      }

      // Google Sheet mein data bhejne ke liye
      const formData = new FormData();
      formData.append("name", name);
      formData.append("dob", dob);

      fetch(scriptURL, {
        method: "POST",
        body: formData,
        mode: "no-cors"   // Cross-origin ke liye zaroori
      })
      .then(() => {
        // Data save hone ke baad video show karo
        document.getElementById("formContainer").style.display = "none";
        document.getElementById("videoContainer").style.display = "block";
      })
      .catch(error => {
        console.error("Error:", error);
        // Phir bhi video dikha do (data save na hone pe bhi experience kharab na ho)
        document.getElementById("formContainer").style.display = "none";
        document.getElementById("videoContainer").style.display = "block";
        alert("Data save karne mein thodi problem aayi, lekin video to dekh lo! 😅");
      });
    });
  </script>

</body>
</html>
